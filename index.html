<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>猜一球 · NBA 球员猜谜</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><a class="brand" href="./"><span class="ball">◉</span> 猜一球 <small>NBA GUESS</small></a><nav aria-label="游戏模式"><span class="free-mode">自由练习 · 随时来一局</span></nav><button class="icon" id="rules">? <span>玩法</span></button></header>
<main><section class="hero"><div><div class="eyebrow">KNOW THE GAME. NAME THE PLAYER.</div><h1>你看球的那些年，<em>还记得谁？</em></h1><p>8 次机会，15 条线索。找到这局的神秘球员。</p></div><div class="court" aria-hidden="true"><div class="court-circle"></div><span>WHO<br>IS IT<span class="orange">?</span></span><b>01 — 08</b></div></section>
<section class="controls"><div class="setting"><label for="difficulty">题库难度</label><select id="difficulty"><option value="active">简单：现役 · 2026–27</option><option value="modern">困难：1985 年之后</option><option value="all">我的青春就是看拉塞尔打球：历史</option></select></div><div class="setting compact"><label>数据范围</label><button id="coverage">试玩题库 · 查看人数 ↗</button></div><div class="snapshot">在线试玩 <span>· 正式名单快照</span></div><button id="restart">↻ 换一位</button></section>
<section class="playbar"><div class="search-wrap"><span class="search-symbol">⌕</span><input id="search" autocomplete="off" role="combobox" aria-controls="candidates" aria-expanded="false" placeholder="输入中文名、英文名或绰号，比如「萌神」" aria-label="搜索球员"><kbd>↵</kbd><div id="candidates" role="listbox" hidden></div></div><div class="counter"><strong id="count">0</strong><span>/ 8 次猜测</span></div></section>
<div class="board-top"><span id="status" aria-live="polite">从你最熟悉的球员开始。</span><div class="legend"><span><i class="exact"></i>完全匹配</span><span><i class="partial"></i>部分匹配</span><span><i class="miss"></i>不匹配</span><span>↑↓ 答案更大 / 更小</span></div></div>
<section class="board" aria-label="猜测记录"><div id="grid"></div><div id="empty"><div class="empty-ball">◉</div><strong>第一球，由你来猜</strong><p>搜索一名球员，看看你离答案有多近。</p><div id="suggestions"></div></div></section>
<div class="bottom"><div class="pager"><button id="prev">←</button><span id="page-label">全部属性</span><button id="next">→</button></div><span id="hint">未知字段不参与比较</span><button id="give-up">放弃本局</button><button id="share">↗ 分享成绩</button></div></main>
<footer><span>猜一球 <b> / </b> 为热爱篮球的你</span><button id="history">对局记录</button><span class="foot-note">NBA 官方资料 · 非 NBA 官方产品</span><span id="date"></span></footer></div>
<dialog id="modal"><button id="close" aria-label="关闭">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
